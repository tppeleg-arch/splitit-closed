<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitIt has closed</title>
  <meta name="description" content="SplitIt has closed. Thank you to everyone who tried it.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F1;
      --ink: #14181F;
      --ink-2: #4A5566;
      --ink-3: #8A92A0;
      --line: #E5E2DA;
      --accent: #4F8FE0;
      --accent-2: #2E6BC4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Source Serif 4', 'Source Serif Pro', ui-serif, Georgia, serif;
      font-feature-settings: 'ss01';
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 460px; text-align: center; }
    .logo {
      width: 44px; height: 44px;
      margin: 0 auto 28px;
      border-radius: 11px;
      background: var(--accent);
      display: grid; place-items: center;
    }
    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin: 0 0 16px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink-2);
      margin: 0 0 12px;
    }
    .small {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--ink-3);
    }
    a { color: var(--accent-2); text-underline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="2.2"/>
        <circle cx="6" cy="19" r="2.2"/>
        <circle cx="18" cy="19" r="2.2"/>
        <path d="M12 7.2v4.3M12 11.5 7 16.9M12 11.5l5 5.4"/>
      </svg>
    </div>
    <h1>SplitIt has closed</h1>
    <p>Thank you to everyone who gave it a try.<br>I&rsquo;m grateful you were part of it.</p>
    <p>All account data was permanently deleted in October 2026.</p>
    <p class="small">Questions? Email <a href="mailto:tppeleg@gmail.com">tppeleg@gmail.com</a></p>
  </main>
</body>
</html>
